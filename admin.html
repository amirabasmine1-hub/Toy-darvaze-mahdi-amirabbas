<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | توی دروازه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef8ff;
      color: #17324d;
    }

    .header {
      background: linear-gradient(135deg, #0789dc, #39b7ff);
      color: white;
      padding: 25px;
      box-shadow: 0 5px 20px #0001;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: .9;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .status {
      padding: 14px 18px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 20px #0000000d;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .status.ok {
      color: #087a45;
    }

    .status.error {
      color: #c62828;
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 30px #0000000d;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d7e7f2;
      border-radius: 12px;
      padding: 13px;
      font: inherit;
      outline: none;
      background: #fbfdff;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #1296e5;
      box-shadow: 0 0 0 3px #1296e51a;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 18px;
      background: #1296e5;
      color: white;
    }

    .primary:hover {
      background: #087fc5;
    }

    .refresh {
      background: #e8f6ff;
      color: #087fc5;
      margin-bottom: 15px;
    }

    .news-item {
      border: 1px solid #e1eef6;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      background: #fbfdff;
    }

    .news-item h3 {
      margin: 0 0 8px;
      color: #087fc5;
    }

    .news-date {
      font-size: 12px;
      color: #78909c;
      margin-bottom: 10px;
    }

    .news-text {
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .delete {
      margin-top: 14px;
      background: #fff0f0;
      color: #c62828;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #78909c;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <h1>⚽ پنل مدیریت توی دروازه</h1>
    <p>مدیریت اخبار سایت از طریق Cloudflare Worker</p>
  </div>
</header>

<main class="container">

  <div id="status" class="status">
    ⏳ در حال اتصال به سرور...
  </div>

  <div class="grid">

    <section class="card">
      <h2>📰 افزودن خبر</h2>

      <form id="newsForm">

        <label for="title">عنوان خبر</label>
        <input
          id="title"
          type="text"
          placeholder="مثلاً: اولین خبر سایت 🎮"
          required
        >

        <label for="date">تاریخ</label>
        <input
          id="date"
          type="text"
          placeholder="مثلاً: ۸ مهر ۱۴۰۵"
        >

        <label for="text">متن خبر</label>
        <textarea
          id="text"
          placeholder="متن خبر را اینجا بنویس..."
        ></textarea>

        <button class="primary" type="submit">
          ➕ افزودن خبر
        </button>

      </form>
    </section>

    <section class="card">

      <h2>📋 اخبار سایت</h2>

      <button class="refresh" id="refresh">
        🔄 بروزرسانی اخبار
      </button>

      <div id="newsList">
        <div class="loading">
          ⏳ در حال دریافت اخبار...
        </div>
      </div>

    </section>

  </div>

</main>

<script>
const API = "https://toy-darvaze.amirabasmine1.workers.dev";

const statusBox = document.getElementById("status");
const newsList = document.getElementById("newsList");
const newsForm = document.getElementById("newsForm");

function setStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function loadNews() {
  newsList.innerHTML = `
    <div class="loading">
      ⏳ در حال دریافت اخبار...
    </div>
  `;

  try {
    const response = await fetch(API + "/news");

    if (!response.ok) {
      throw new Error("خطا در دریافت اخبار");
    }

    const data = await response.json();

    const documents = data.documents || [];

    if (!documents.length) {
      newsList.innerHTML = `
        <div class="empty">
          📰 هنوز خبری ثبت نشده است.
        </div>
      `;

      setStatus("✅ اتصال برقرار است؛ خبری وجود ندارد.", "ok");
      return;
    }

    newsList.innerHTML = documents.map(doc => {

      const id = doc.name.split("/").pop();

      const title =
        doc.fields?.title?.stringValue || "بدون عنوان";

      const text =
        doc.fields?.text?.stringValue || "";

      const date =
        doc.fields?.date?.stringValue || "";

      return `
        <article class="news-item">

          <h3>${escapeHTML(title)}</h3>

          ${
            date
              ? `<div class="news-date">📅 ${escapeHTML(date)}</div>`
              : ""
          }

          <div class="news-text">
            ${escapeHTML(text)}
          </div>

          <button
            class="delete"
            onclick="deleteNews('${encodeURIComponent(id)}')"
          >
            🗑️ حذف خبر
          </button>

        </article>
      `;

    }).join("");

    setStatus(
      `✅ اتصال موفق — ${documents.length} خبر دریافت شد.`,
      "ok"
    );

  } catch (error) {

    newsList.innerHTML = `
      <div class="empty">
        ❌ دریافت اخبار ناموفق بود.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    setStatus(
      "❌ اتصال به Worker برقرار نشد.",
      "error"
    );
  }
}

newsForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  const title = document.getElementById("title").value.trim();
  const date = document.getElementById("date").value.trim();
  const text = document.getElementById("text").value.trim();

  if (!title) {
    alert("عنوان خبر را وارد کن.");
    return;
  }

  setStatus("⏳ در حال اضافه کردن خبر...");

  try {

    const response = await fetch(API + "/news", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        title,
        date,
        text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "افزودن خبر ناموفق بود."
      );
    }

    newsForm.reset();

    setStatus(
      "✅ خبر با موفقیت اضافه شد!",
      "ok"
    );

    await loadNews();

  } catch (error) {

    setStatus(
      "❌ افزودن خبر انجام نشد: " + error.message,
      "error"
    );
  }
});

async function deleteNews(id) {

  if (!confirm("این خبر حذف شود؟")) {
    return;
  }

  setStatus("⏳ در حال حذف خبر...");

  try {

    const response = await fetch(
      API + "/news/" + id,
      {
        method: "DELETE"
      }
    );

    if (!response.ok) {
      throw new Error("حذف خبر ناموفق بود.");
    }

    setStatus(
      "✅ خبر حذف شد.",
      "ok"
    );

    await loadNews();

  } catch (error) {

    setStatus(
      "❌ حذف انجام نشد: " + error.message,
      "error"
    );
  }
}

document.getElementById("refresh")
  .addEventListener("click", loadNews);

loadNews();
</script>

</body>
</html>
